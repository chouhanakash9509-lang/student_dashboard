<!DOCTYPE html>
<html>
<head>
<title>Analytics</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

<h2>Student Performance Analytics</h2>
<a href="Dashbord.html">← Back to Dashboard</a>

<div style="margin:20px 0;display:flex;gap:10px;flex-wrap:wrap;">
    <input type="text" id="classInput" placeholder="Class (e.g. B.Tech)" style="padding:8px;border-radius:6px;border:1px solid #ccc;">
    <input type="text" id="sectionInput" placeholder="Section (e.g. A)" style="padding:8px;border-radius:6px;border:1px solid #ccc;">
    <select id="examType" style="padding:8px;border-radius:6px;border:1px solid #ccc;">
        <option value="">All Exam Types</option>
        <option value="unit-test">Unit Test</option>
        <option value="mid-term">Mid Term</option>
        <option value="final">Final</option>
    </select>
    <input type="text" id="academicYear" placeholder="Academic Year (e.g. 2024-25)" style="padding:8px;border-radius:6px;border:1px solid #ccc;">
    <button onclick="loadAnalytics()" style="padding:8px 16px;border-radius:6px;background:#4CAF50;color:white;border:none;cursor:pointer;">Get Analytics</button>
</div>

<p id="status-msg" style="color:gray;"></p>

<div id="analytics-result" style="display:none;background:#f9f9f9;padding:20px;border-radius:8px;margin-top:10px;">
    <h3>Class Analytics</h3>
    <p>Total Students: <strong id="totalStudents"></strong></p>
    <p>Total Results: <strong id="totalResults"></strong></p>
    <p>Passed: <strong id="passed" style="color:green;"></strong></p>
    <p>Failed: <strong id="failed" style="color:red;"></strong></p>
    <p>Average Percentage: <strong id="avgPercentage"></strong>%</p>
    <h4>Grade Distribution:</h4>
    <div id="gradeDistribution"></div>
    <div style="max-width:380px;margin:24px auto 0;">
        <canvas id="gradeChart"></canvas>
    </div>
</div>

<h3 style="margin-top:30px;">Top Performers</h3>
<table id="toppersTable">
<tr><th>Name</th><th>Roll No</th><th>Class</th><th>Percentage</th><th>Grade</th></tr>
</table>

</div>

<script>
const API = '/api';
const token = localStorage.getItem('token');

if (!token) window.location.href = 'index.html';

async function loadAnalytics() {
    const cls = document.getElementById('classInput').value;
    const section = document.getElementById('sectionInput').value;
    const examType = document.getElementById('examType').value;
    const academicYear = document.getElementById('academicYear').value;
    const statusMsg = document.getElementById('status-msg');

    if (!cls) { statusMsg.textContent = 'Please enter a class.'; return; }
    statusMsg.textContent = 'Loading...';

    if (window._gradeChart) { window._gradeChart.destroy(); }
    let url = `${API}/results/analytics/class?class=${encodeURIComponent(cls)}`;
    if (section) url += `&section=${encodeURIComponent(section)}`;
    if (examType) url += `&examType=${encodeURIComponent(examType)}`;
    if (academicYear) url += `&academicYear=${encodeURIComponent(academicYear)}`;

    try {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();

        if (data.success) {
            statusMsg.textContent = '';
            const a = data.analytics;
            document.getElementById('totalStudents').textContent = a.totalStudents;
            document.getElementById('totalResults').textContent = a.totalResults;
            document.getElementById('passed').textContent = a.passed;
            document.getElementById('failed').textContent = a.failed;
            document.getElementById('avgPercentage').textContent = a.averagePercentage;
            document.getElementById('gradeDistribution').innerHTML =
                Object.entries(a.gradeDistribution).map(([g, c]) => `<span style="margin-right:15px;"><strong>${g}:</strong> ${c}</span>`).join('');
            document.getElementById('analytics-result').style.display = 'block';

            const grades = Object.keys(a.gradeDistribution);
            const counts = Object.values(a.gradeDistribution);
            const colors = ['#4CAF50','#2196F3','#FF9800','#9C27B0','#F44336','#00BCD4','#FF5722'];
            window._gradeChart = new Chart(document.getElementById('gradeChart'), {
                type: 'pie',
                data: {
                    labels: grades,
                    datasets: [{ data: counts, backgroundColor: colors.slice(0, grades.length), borderWidth: 2 }]
                },
                options: {
                    plugins: {
                        legend: { position: 'bottom' },
                        title: { display: true, text: 'Grade Distribution', font: { size: 16 } }
                    }
                }
            });
        } else {
            statusMsg.textContent = data.message || 'No data found.';
            document.getElementById('analytics-result').style.display = 'none';
        }
    } catch {
        statusMsg.textContent = 'Cannot connect to server.';
    }
}

async function loadToppers() {
    try {
        const res = await fetch(`${API}/results/analytics/toppers?limit=5`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const table = document.getElementById('toppersTable');
        while (table.rows.length > 1) table.deleteRow(1);

        if (data.success && data.data.length > 0) {
            data.data.forEach(r => {
                const row = table.insertRow();
                row.innerHTML = `
                    <td>${r.studentId?.name || '-'}</td>
                    <td>${r.studentId?.rollNumber || '-'}</td>
                    <td>${r.studentId?.class || '-'}</td>
                    <td>${r.percentage}%</td>
                    <td>${r.grade}</td>
                `;
            });
        } else {
            const row = table.insertRow();
            row.innerHTML = '<td colspan="5">No results found.</td>';
        }
    } catch {
        console.log('Could not load toppers');
    }
}

loadToppers();
</script>

</body>
</html>
