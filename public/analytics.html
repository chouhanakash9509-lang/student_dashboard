<!DOCTYPE html>
<html>
<head>
<title>Analytics</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">

<h2>Student Performance Analytics</h2>
<a href="Dashbord.html">← Back to Dashboard</a>

<div style="margin:20px 0;display:flex;gap:10px;flex-wrap:wrap;">
    <input type="text" id="classInput" placeholder="Class (e.g. B.Tech)" style="padding:8px;border-radius:6px;border:1px solid #ccc;">
    <input type="text" id="sectionInput" placeholder="Section (e.g. A)" style="padding:8px;border-radius:6px;border:1px solid #ccc;">
    <select id="examType" style="padding:8px;border-radius:6px;border:1px solid #ccc;">
        <option value="">All Exam Types</option>
        <option value="unit-test">Unit Test</option>
        <option value="mid-term">Mid Term</option>
        <option value="final">Final</option>
    </select>
    <input type="text" id="academicYear" placeholder="Academic Year (e.g. 2024-25)" style="padding:8px;border-radius:6px;border:1px solid #ccc;">
    <button onclick="loadAnalytics()" style="padding:8px 16px;border-radius:6px;background:#4CAF50;color:white;border:none;cursor:pointer;">Get Analytics</button>
</div>

<p id="status-msg" style="color:gray;"></p>

<div id="analytics-result" style="display:none;">

    <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;">
        <div style="background:#e8f5e9;padding:16px 24px;border-radius:8px;text-align:center;">
            <div style="font-size:28px;font-weight:bold;color:#2e7d32;" id="totalStudents">0</div>
            <div style="color:#555;">Total Students</div>
        </div>
        <div style="background:#e3f2fd;padding:16px 24px;border-radius:8px;text-align:center;">
            <div style="font-size:28px;font-weight:bold;color:#1565c0;" id="avgPercentage">0</div>
            <div style="color:#555;">Avg Percentage %</div>
        </div>
        <div style="background:#f1f8e9;padding:16px 24px;border-radius:8px;text-align:center;">
            <div style="font-size:28px;font-weight:bold;color:#558b2f;" id="passed">0</div>
            <div style="color:#555;">Passed</div>
        </div>
        <div style="background:#fce4ec;padding:16px 24px;border-radius:8px;text-align:center;">
            <div style="font-size:28px;font-weight:bold;color:#c62828;" id="failed">0</div>
            <div style="color:#555;">Failed</div>
        </div>
    </div>

    <div style="display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start;">

        <!-- Pie chart: grade distribution -->
        <div style="background:#f9f9f9;padding:20px;border-radius:8px;flex:1;min-width:280px;max-width:400px;">
            <h4 style="margin:0 0 12px;">Grade Distribution</h4>
            <canvas id="gradeChart"></canvas>
        </div>

        <!-- Bar chart: student name vs percentage -->
        <div style="background:#f9f9f9;padding:20px;border-radius:8px;flex:2;min-width:300px;">
            <h4 style="margin:0 0 12px;">Student Performance</h4>
            <canvas id="studentChart"></canvas>
        </div>

    </div>

    <!-- Student table -->
    <h4 style="margin:28px 0 10px;">Student Results</h4>
    <table id="studentResultsTable" style="width:100%;border-collapse:collapse;">
        <tr>
            <th>Name</th><th>Roll No</th><th>Exam Type</th><th>Percentage</th><th>Grade</th><th>Status</th>
        </tr>
    </table>

</div>

<h3 style="margin-top:30px;">Top Performers</h3>
<table id="toppersTable">
    <tr><th>Name</th><th>Roll No</th><th>Class</th><th>Percentage</th><th>Grade</th></tr>
</table>

</div>

<script>
const API = '/api';
const token = localStorage.getItem('token');
if (!token) window.location.href = 'index.html';

const COLORS = ['#4CAF50','#2196F3','#FF9800','#9C27B0','#F44336','#00BCD4','#FF5722','#795548'];

function getGrade(pct) {
    if (pct >= 90) return 'A+';
    if (pct >= 80) return 'A';
    if (pct >= 70) return 'B+';
    if (pct >= 60) return 'B';
    if (pct >= 50) return 'C';
    if (pct >= 33) return 'D';
    return 'F';
}

async function loadAnalytics() {
    const cls = document.getElementById('classInput').value.trim();
    const section = document.getElementById('sectionInput').value.trim();
    const examType = document.getElementById('examType').value;
    const academicYear = document.getElementById('academicYear').value.trim();
    const statusMsg = document.getElementById('status-msg');

    if (!cls) { statusMsg.textContent = 'Please enter a class.'; return; }
    statusMsg.textContent = 'Loading...';

    if (window._gradeChart) { window._gradeChart.destroy(); window._gradeChart = null; }
    if (window._studentChart) { window._studentChart.destroy(); window._studentChart = null; }

    let url = `${API}/results/analytics/class?class=${encodeURIComponent(cls)}`;
    if (section) url += `&section=${encodeURIComponent(section)}`;
    if (examType) url += `&examType=${encodeURIComponent(examType)}`;
    if (academicYear) url += `&academicYear=${encodeURIComponent(academicYear)}`;

    try {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();

        if (!data.success) {
            statusMsg.textContent = data.message || 'No data found.';
            document.getElementById('analytics-result').style.display = 'none';
            return;
        }

        statusMsg.textContent = '';
        const a = data.analytics;
        document.getElementById('totalStudents').textContent = a.totalStudents;
        document.getElementById('avgPercentage').textContent = a.averagePercentage;
        document.getElementById('passed').textContent = a.passed;
        document.getElementById('failed').textContent = a.failed;
        document.getElementById('analytics-result').style.display = 'block';

        // Pie chart — grade distribution
        const grades = Object.keys(a.gradeDistribution);
        const gradeCounts = Object.values(a.gradeDistribution);
        if (grades.length > 0) {
            window._gradeChart = new Chart(document.getElementById('gradeChart'), {
                type: 'pie',
                data: {
                    labels: grades,
                    datasets: [{ data: gradeCounts, backgroundColor: COLORS.slice(0, grades.length), borderWidth: 2 }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });
        }

        // Bar chart — student name vs percentage
        const students = data.students || [];
        if (students.length > 0) {
            const names = students.map(s => s.name);
            const percentages = students.map(s => s.percentage);
            const barColors = students.map(s => s.isPassed ? '#4CAF50' : '#F44336');

            window._studentChart = new Chart(document.getElementById('studentChart'), {
                type: 'bar',
                data: {
                    labels: names,
                    datasets: [{
                        label: 'Percentage %',
                        data: percentages,
                        backgroundColor: barColors,
                        borderRadius: 4
                    }]
                },
                options: {
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Student results table
        const sTable = document.getElementById('studentResultsTable');
        while (sTable.rows.length > 1) sTable.deleteRow(1);
        if (students.length > 0) {
            students.forEach(s => {
                const row = sTable.insertRow();
                row.innerHTML = `
                    <td>${s.name}</td>
                    <td>${s.rollNumber}</td>
                    <td>${s.examType}</td>
                    <td>${s.percentage}%</td>
                    <td>${s.grade}</td>
                    <td style="color:${s.isPassed ? 'green' : 'red'}">${s.isPassed ? 'Pass' : 'Fail'}</td>
                `;
            });
        } else {
            const row = sTable.insertRow();
            row.innerHTML = '<td colspan="6" style="text-align:center;">No results found for this class.</td>';
        }

        loadToppers(cls, section, examType, academicYear);

    } catch {
        statusMsg.textContent = 'Cannot connect to server.';
    }
}

async function loadToppers(cls = '', section = '', examType = '', academicYear = '') {
    try {
        let url = `${API}/results/analytics/toppers?limit=5`;
        if (cls) url += `&class=${encodeURIComponent(cls)}`;
        if (section) url += `&section=${encodeURIComponent(section)}`;
        if (examType) url += `&examType=${encodeURIComponent(examType)}`;
        if (academicYear) url += `&academicYear=${encodeURIComponent(academicYear)}`;

        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const table = document.getElementById('toppersTable');
        while (table.rows.length > 1) table.deleteRow(1);

        if (data.success && data.data.length > 0) {
            data.data.forEach(r => {
                const row = table.insertRow();
                row.innerHTML = `
                    <td>${r.studentId?.name || '-'}</td>
                    <td>${r.studentId?.rollNumber || '-'}</td>
                    <td>${r.studentId?.class || '-'}</td>
                    <td>${r.percentage}%</td>
                    <td>${r.grade}</td>
                `;
            });
        } else {
            const row = table.insertRow();
            row.innerHTML = '<td colspan="5">No results found.</td>';
        }
    } catch {
        console.log('Could not load toppers');
    }
}

loadToppers();
</script>

</body>
</html>
