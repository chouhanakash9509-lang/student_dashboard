<!DOCTYPE html>
<html>
<head>
<title>Add Result</title>
<link rel="stylesheet" href="style.css">
<style>
.subject-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.subject-row input { flex:1; padding:8px; border-radius:6px; border:1px solid #ccc; }
.subject-row button { padding:6px 12px; border-radius:6px; border:none; background:#e53935; color:white; cursor:pointer; }
#addSubjectBtn { padding:8px 14px; border-radius:6px; border:none; background:#1976D2; color:white; cursor:pointer; margin-bottom:16px; }
</style>
</head>
<body>
<div class="container">

<h2>Add Student Result</h2>
<a href="Dashbord.html">← Back to Dashboard</a>

<div id="error-msg" style="color:red;margin:10px 0;display:none;"></div>
<div id="success-msg" style="color:green;margin:10px 0;display:none;"></div>

<form class="form" id="addResultForm">

<input type="text" id="rollNumber" placeholder="Student Roll Number" required>
<button type="button" onclick="findStudent()" style="padding:8px 14px;border-radius:6px;border:none;background:#4CAF50;color:white;cursor:pointer;margin-bottom:12px;">Find Student</button>
<p id="studentInfo" style="color:#555;margin-bottom:12px;"></p>

<select id="examType" required style="padding:8px;border-radius:6px;border:1px solid #ccc;width:100%;margin-bottom:10px;">
    <option value="">Select Exam Type</option>
    <option value="unit-test">Unit Test</option>
    <option value="mid-term">Mid Term</option>
    <option value="final">Final</option>
</select>

<input type="text" id="academicYear" placeholder="Academic Year (e.g. 2024-25)" required>

<h4 style="margin:12px 0 8px;">Subjects & Marks</h4>
<div id="subjectsContainer">
    <div class="subject-row">
        <input type="text" placeholder="Subject Name" class="subjectName" required>
        <input type="number" placeholder="Marks (0-100)" class="subjectMarks" min="0" max="100" required>
        <input type="number" placeholder="Max Marks" class="subjectMax" min="1" value="100">
    </div>
</div>
<button type="button" id="addSubjectBtn" onclick="addSubjectRow()">+ Add Subject</button>

<button type="submit">Submit Result</button>
</form>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('token');
if (!token) window.location.href = 'index.html';

let foundStudentId = null;

async function findStudent() {
    const roll = document.getElementById('rollNumber').value.trim();
    const info = document.getElementById('studentInfo');
    if (!roll) { info.textContent = 'Enter a roll number.'; return; }

    try {
        const res = await fetch(`${API}/students?search=${encodeURIComponent(roll)}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success && data.data.length > 0) {
            const s = data.data.find(x => x.rollNumber === roll) || data.data[0];
            foundStudentId = s._id;
            info.style.color = 'green';
            info.textContent = `Found: ${s.name} | Class: ${s.class} | Section: ${s.section}`;
        } else {
            foundStudentId = null;
            info.style.color = 'red';
            info.textContent = 'Student not found.';
        }
    } catch {
        info.textContent = 'Cannot connect to server.';
    }
}

function addSubjectRow() {
    const div = document.createElement('div');
    div.className = 'subject-row';
    div.innerHTML = `
        <input type="text" placeholder="Subject Name" class="subjectName" required>
        <input type="number" placeholder="Marks (0-100)" class="subjectMarks" min="0" max="100" required>
        <input type="number" placeholder="Max Marks" class="subjectMax" min="1" value="100">
        <button type="button" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('subjectsContainer').appendChild(div);
}

document.getElementById('addResultForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!foundStudentId) {
        errorMsg.textContent = 'Please find a valid student first.';
        errorMsg.style.display = 'block';
        return;
    }

    const names = [...document.querySelectorAll('.subjectName')].map(i => i.value.trim());
    const marks = [...document.querySelectorAll('.subjectMarks')].map(i => Number(i.value));
    const maxMarks = [...document.querySelectorAll('.subjectMax')].map(i => Number(i.value));

    const subjects = names.map((name, i) => ({ name, marks: marks[i], maxMarks: maxMarks[i] }));

    if (subjects.some(s => !s.name || isNaN(s.marks))) {
        errorMsg.textContent = 'Fill in all subject names and marks.';
        errorMsg.style.display = 'block';
        return;
    }

    const body = {
        studentId: foundStudentId,
        examType: document.getElementById('examType').value,
        academicYear: document.getElementById('academicYear').value.trim(),
        subjects
    };

    try {
        const res = await fetch(`${API}/results`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
            successMsg.textContent = `Result added! Percentage: ${data.data.percentage}% | Grade: ${data.data.grade}`;
            successMsg.style.display = 'block';
            e.target.reset();
            document.getElementById('studentInfo').textContent = '';
            document.getElementById('subjectsContainer').innerHTML = `
                <div class="subject-row">
                    <input type="text" placeholder="Subject Name" class="subjectName" required>
                    <input type="number" placeholder="Marks (0-100)" class="subjectMarks" min="0" max="100" required>
                    <input type="number" placeholder="Max Marks" class="subjectMax" min="1" value="100">
                </div>`;
            foundStudentId = null;
        } else {
            errorMsg.textContent = (data.errors ? data.errors.join(', ') : data.message) || 'Failed to add result.';
            errorMsg.style.display = 'block';
        }
    } catch {
        errorMsg.textContent = 'Cannot connect to server.';
        errorMsg.style.display = 'block';
    }
});
</script>
</body>
</html>
