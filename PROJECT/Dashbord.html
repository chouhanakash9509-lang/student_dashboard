<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Student Dashboard</h1>
<p id="welcome-msg"></p>

<div class="menu">
<a href="add-student.html">Add Student</a>
<a href="add-result.html">Add Result</a>
<a href="view-students.html">View Students</a>
<a href="analytics.html">Analytics</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('token');

if (!token) window.location.href = 'index.html';

async function loadUser() {
    try {
        const res = await fetch(`${API}/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('welcome-msg').textContent = `Welcome, ${data.data.name} (${data.data.role})`;
        } else {
            logout();
        }
    } catch {
        document.getElementById('welcome-msg').textContent = 'Welcome!';
    }
}

function logout() {
    localStorage.removeItem('token');
    window.location.href = 'index.html';
}

loadUser();
</script>

</body>
</html>
