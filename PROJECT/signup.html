<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Portal Sign Up</title>
<link rel="stylesheet" href="signup.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

<div class="left-section">
<div class="signup-box">

<h1>Sign Up</h1>
<p class="subtitle">Create your account</p>

<div id="error-msg" style="color:red;margin-bottom:10px;display:none;"></div>
<div id="success-msg" style="color:green;margin-bottom:10px;display:none;"></div>

<form id="signupForm">

<div class="input-group">
<label>Full Name</label>
<input type="text" id="name" placeholder="Enter full name" required>
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="email" placeholder="Enter email" required>
</div>

<div class="input-group">
<label>Role</label>
<select id="role" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;">
    <option value="student">Student</option>
    <option value="teacher">Teacher</option>
    <option value="admin">Admin</option>
</select>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Enter password (min 6 chars)" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm password" required>
</div>

<button type="submit" class="signup-btn">Create Account</button>

</form>

<div class="login-link">
<span>Already have an account?</span>
<a href="index.html">Login</a>
</div>

</div>
</div>

<div class="right-section">
<div class="welcome-content">
<h1>Student Portal</h1>
<p>Create your account to continue</p>
</div>
</div>

</div>

<script>
const API = '/api';

document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const role = document.getElementById('role').value;
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match';
        errorMsg.style.display = 'block';
        return;
    }

    try {
        const res = await fetch(`${API}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, role })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('token', data.token);
            successMsg.textContent = 'Account created! Redirecting...';
            successMsg.style.display = 'block';
            setTimeout(() => window.location.href = 'Dashbord.html', 1500);
        } else {
            errorMsg.textContent = (data.errors ? data.errors.join(', ') : data.message) || 'Registration failed';
            errorMsg.style.display = 'block';
        }
    } catch (err) {
        errorMsg.textContent = 'Cannot connect to server. Make sure backend is running.';
        errorMsg.style.display = 'block';
    }
});
</script>

</body>
</html>
